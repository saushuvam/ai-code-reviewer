server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /ai/ {
        proxy_pass http://backend:3000/ai/;
        proxy_http_version 1.1;
        proxy_buffering off;       # required so streamed reviews aren't buffered
        proxy_read_timeout 120s;
        proxy_set_header Connection '';
    }
}
